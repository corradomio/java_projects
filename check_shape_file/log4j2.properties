#status = error
#name = PropertiesConf

# Define the root logger and assign appenders
rootLogger.level=DEBUG
rootLogger.appenderRefs=Console, RollingFile
rootLogger.appenderRef.Console.ref=Console
rootLogger.appenderRef.RollingFile.ref=RollingFile

# Configure a Console Appender
appender.Console.type=Console
appender.Console.name=Console
appender.Console.layout.type=PatternLayout
#appender.Console.layout.pattern=%d{ISO8601} | %-5p | %t | %c{1} | %m%n
appender.Console.layout.pattern=Log4J2 %d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

# Configure a Rolling File Appender
appender.RollingFile.type=RollingFile
appender.RollingFile.name=RollingFile
appender.RollingFile.fileName=logs/app-2.log
appender.RollingFile.filePattern=logs/app-2.log.%d{yyyy-MM-dd}
appender.RollingFile.layout.type=PatternLayout
appender.RollingFile.policies.type=Policies
appender.RollingFile.policies.time.type=TimeBasedTriggeringPolicy
#appender.RollingFile.layout.pattern=%d{ISO8601} | %-5p | %t | %c{1} | %m%n
appender.RollingFile.layout.pattern=Log4J2 %d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n
