
# Define the root logger and assign appenders
log4j2.rootLogger.level=DEBUG
log4j2.rootLogger.appenderRefs=Console, RollingFile
log4j2.rootLogger.appenderRef.Console.ref=Console
log4j2.rootLogger.appenderRef.RollingFile.ref=RollingFile

# Configure a Console Appender
log4j2.appender.Console.type=Console
log4j2.appender.Console.name=Console
log4j2.appender.Console.layout.type=PatternLayout
#log4j2.appender.Console.layout.pattern=%d{ISO8601} | %-5p | %t | %c{1} | %m%n
log4j2.appender.Console.layout.pattern=Log4J2 %d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

# Configure a Rolling File Appender
log4j2.appender.RollingFile.type=RollingFile
log4j2.appender.RollingFile.name=RollingFile
log4j2.appender.RollingFile.fileName=logs/app-2.log
log4j2.appender.RollingFile.filePattern=logs/app-2.log.%d{yyyy-MM-dd}
log4j2.appender.RollingFile.layout.type=PatternLayout
log4j2.appender.RollingFile.policies.type=Policies
log4j2.appender.RollingFile.policies.time.type=TimeBasedTriggeringPolicy
#log4j2.appender.RollingFile.layout.pattern=%d{ISO8601} | %-5p | %t | %c{1} | %m%n
log4j2.appender.RollingFile.layout.pattern=Log4J2 %d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n
