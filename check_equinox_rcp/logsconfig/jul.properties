# Global logging handlers (Console and File)
handlers=java.util.logging.ConsoleHandler, java.util.logging.FileHandler

# Default global logging level
.level=ALL


# Console handler settings
java.util.logging.ConsoleHandler.level=INFO
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
# Optional encoding property (useful for international characters)
java.util.logging.ConsoleHandler.encoding=UTF-8

# File handler settings
java.util.logging.FileHandler.level=FINE
java.util.logging.FileHandler.pattern=logs/jul_%g.log
java.util.logging.FileHandler.limit=50000000
java.util.logging.FileHandler.count=10
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.FileHandler.append=true
java.util.logging.FileHandler.encoding=UTF-8

# Format for SimpleFormatter - detailed breakdown of each parameter:
# %1$t... = timestamp (various time/date formats)
# %2$s = source class and method
# %3$s = logger name
# %4$s = log level
# %5$s = message
# %6$s = thrown exception (if any)
# %n = platform-specific line separator
java.util.logging.SimpleFormatter.format=JULp %1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS.%1$tL %4$s %3$s [%2$s] %5$s%6$s%n
