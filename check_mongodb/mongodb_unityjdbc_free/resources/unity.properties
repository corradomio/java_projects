SourceBuilder.messageText = <h3>Welcome!  To get started either:</h3>\r\n<ol>\r\n<li>Create your own sources by:\r\n<ol type=\"a\">\r\n <li>File Menu->New Source Group and create new XML config file.\r\n <li>File Menu->New Source and enter the JDBC connection information for each source.\r\n  <li> More instructions are in Help->Getting Started.\r\n </ol>\r\n\r\n<li>Start the sample database and try some demonstration queries.\r\n<ol type=\"a\">\r\n  <li>Sample database can be started using Shortcut in Start menu on Windows or running startDB.sh script in sampleDB/hsqldb in installation directory.\r\n  <li>Select any demonstration query in Demonstration menu and run it.\r\n</ol>\r\n</ol>\r\n
