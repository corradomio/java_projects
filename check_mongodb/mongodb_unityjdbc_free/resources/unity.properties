HelpFrame.title = Getting Started
HelpFrame.getstarted = How To Get Started
HelpFrame.helptext = UnityJDBC SourceBuilder is designed to produce XML configuration files so that you can use UnityJDBC with your application.  You can also use it to test your installation and run cross-database queries.\r\n\r\nStep #1: Under the demonstration menu, select any one of the sample queries and execute it.  If the sample database is running, this should produce a query result.  Note that queries are limited to 100 results in the trial version.\r\n\r\nStep #2: Create your own virtualized source group.  First, from the File Menu select New Source Group and select a file location.  A Source Group is an XML file that stores the connection information of all your sources.  \r\n\r\nStep #3: Add sources to your source group.  From the File Menu, select Add Source.  Fill out the connection information for your source and provide a source name.  This source name will be how you refer to sources in your queries and does not have to be the same as the database system name.  Repeat the process for all your sources.  If you have issues with connecting or extracting your source information, make sure your JDBC driver for the source is in your classpath.   Free help is available for setup by contacting support@unityjdbc.com.\r\n\r\nStep #4: Try to execute some cross-database queries once your sources are configured. Write your SQL query as usual except now you can refer to more than one source.  For example, if you had one source called db1 and another called db2, you could write a query like this:\r\n\r\nSELECT * FROM DB1.Table1 T INNER JOIN DB2.Table2. T2 ON T.id = T2.id\r\n\r\nThe only change from standard SQL is that you prefix the table name with the source name that it is from.\r\n\r\nStep #5: Once you have added all your sources, you will have a source group XML file and one or more source XML files.  You can use UnityJDBC in your own Java programs and query and reporting software by following this steps:\r\n\r\na) Place the XML files in a directory where they can be accessed by your report or query program.  For example, if you sources file is sources.xml in the location c:/unity/sources.xml, then the URL to access your sources is jdbc:unity://c:/unity/sources.xml.  Absolute or relative paths are possible.\r\n\r\nb) Make sure the unityjdbc.jar is in the CLASSPATH accessible to your program.  The easiest way is to put unityjdbc.jar in your <JAVA_HOME>/lib/ext directory.\r\n\r\nc) Run your Java/JDBC software as usual with a JDBC driver class of unity.jdbc.UnityDriver and the URL as defined above.\r\n\r\nFor more information, go to http://www.unityjdbc.com/support/.
